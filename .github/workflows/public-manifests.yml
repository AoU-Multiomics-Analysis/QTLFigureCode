name: Public manifest privacy

on:
  pull_request:
  push:
    branches: [main, 'codex/**']

permissions:
  contents: read

jobs:
  public-manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Test address detection
        run: python3 -m unittest discover -s tests -p test_public_manifests.py
      - name: Check public files
        run: python3 tools/check_public_manifests.py
